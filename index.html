function editRender(){$('editIntro').value=data.intro||'';$('siteUrl').value=data.siteUrl||'';$('accent').value=data.accent||defaults.accent;$('editLinks').replaceChildren();for(const item of data.links||[])addEditorRow(item)}
function addEditorRow(item={name:'',url:'',label:'',icon:'↗'}){let box=document.createElement('div');box.className='admin-item';for(const [key,hint] of [['name','ชื่อช่องทาง'],['url','https://...'],['label','คำอธิบาย'],['icon','ไอคอน 1–2 ตัว']]){let input=document.createElement('input');input.placeholder=hint;input.dataset.key=key;input.value=item[key]||'';box.append(input)}let del=document.createElement('button');del.type='button';del.textContent='ลบ';del.onclick=()=>box.remove();box.append(del);
box.imageData=item.image||'';let uploader=document.createElement('div');uploader.className='upload-row';let preview=document.createElement('img');preview.className='image-preview';preview.alt='ตัวอย่างรูปช่องทาง';let label=document.createElement('label');label.className='upload-label';label.textContent='เลือกรูปโลโก้';let file=document.createElement('input');file.type='file';file.accept='image/png,image/jpeg,image/webp';file.className='visually-hidden';label.append(file);let clear=document.createElement('button');clear.type='button';clear.textContent='เอารูปออก';clear.onclick=()=>{box.imageData='';file.value='';updatePreview()};function updatePreview(){preview.classList.toggle('hidden',!box.imageData);clear.classList.toggle('hidden',!box.imageData);if(box.imageData)preview.src=box.imageData;else preview.removeAttribute('src')}
file.onchange=async()=>{let chosen=file.files?.[0];if(!chosen)return;if(!['image/png','image/jpeg','image/webp'].includes(chosen.type)||chosen.size>10*1024*1024){$('status').textContent='กรุณาเลือกรูป PNG, JPG หรือ WebP ขนาดไม่เกิน 10 MB';file.value='';return}try{let bitmap=await createImageBitmap(chosen);let canvas=document.createElement('canvas');canvas.width=128;canvas.height=128;let ctx=canvas.getContext('2d');ctx.clearRect(0,0,128,128);let ratio=Math.min(128/bitmap.width,128/bitmap.height);let w=bitmap.width*ratio,h=bitmap.height*ratio;ctx.drawImage(bitmap,(128-w)/2,(128-h)/2,w,h);bitmap.close();let encoded=canvas.toDataURL('image/webp',.82);if(encoded.length>100000)throw Error('รูปที่ย่อแล้วยังใหญ่เกินไป');box.imageData=encoded;updatePreview();$('status').textContent='เลือกรูปแล้ว กดบันทึกเพื่อเผยแพร่'}catch(err){$('status').textContent='อ่านรูปไม่สำเร็จ กรุณาลองรูปอื่น'}file.value=''};
uploader.append(preview,label,clear);box.append(uploader);updatePreview();$('editLinks').append(box)}
$('adminBtn').onclick=()=>{$('adminDialog').showModal();updateAdmin()};$('closeDialog').onclick=()=>$('adminDialog').close();$('adminDialog').onclick=e=>{if(e.target===$('adminDialog'))$('adminDialog').close()};$('adminDialog').addEventListener('close',async()=>{if(auth&&currentUser){let m=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');await m.signOut(auth)}$('password').value='';$('status').textContent=''});$('addLink').onclick=()=>addEditorRow();$('resetColor').onclick=()=>$('accent').value=defaults.accent;
function updateAdmin(){let yes=!!currentUser&&ADMIN_UIDS.includes(currentUser.uid);$('loginArea').classList.toggle('hidden',yes);$('editorArea').classList.toggle('hidden',!yes);$('modalTitle').textContent=yes?'จัดการหน้า ZAAP':'เข้าสู่ระบบผู้ดูแล';if(yes)editRender()}
$('loginForm').onsubmit=async e=>{e.preventDefault();if(!auth){$('status').textContent='กรุณาตั้งค่า Firebase ก่อน';return}try{let account=ADMINS[$('username').value.trim().toLowerCase()];if(!account?.email){$('status').textContent='ไม่พบชื่อผู้ใช้หรือยังไม่ได้ตั้งค่าบัญชี';return}let m=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');await m.signInWithEmailAndPassword(auth,account.email,$('password').value);$('status').textContent='เข้าสู่ระบบแล้ว'}catch(err){$('status').textContent=['auth/invalid-credential','auth/wrong-password','auth/user-not-found'].includes(err.code)?'อีเมลหรือรหัสผ่านไม่ตรงกับบัญชี Firebase กรุณาตรวจรหัสผ่านที่บันทึกไว้ในเบราว์เซอร์ และลองกรอกใหม่':'เข้าสู่ระบบไม่สำเร็จ: '+err.message}};
$('logout').onclick=async()=>{if(auth){let m=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');await m.signOut(auth)}$('status').textContent='ออกจากระบบแล้ว'};
$('save').onclick=async()=>{if(!currentUser||!ADMIN_UIDS.includes(currentUser.uid)||!db||!docRef)return;let rows=[...$('editLinks').children].map(row=>Object.fromEntries([...row.querySelectorAll('input[data-key]')].map(x=>[x.dataset.key,x.value.trim()]).concat([['image',row.imageData||'']]))).filter(x=>x.name||x.url);if(rows.some(x=>!x.name||!safeUrl(x.url))){$('status').textContent='กรุณากรอกชื่อและ URL ที่ขึ้นต้นด้วย https:// ให้ครบ';return}let raw=$('siteUrl').value.trim();if(raw&&!safeUrl(raw)){$('status').textContent='URL ของ QR ไม่ถูกต้อง';return}let next={intro:$('editIntro').value.trim(),siteUrl:raw,accent:$('accent').value,links:rows,channelSeedVersion:CHANNEL_SEED_VERSION};try{let m=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js');await m.setDoc(docRef,next);$('status').textContent='บันทึกสำเร็จ';$('adminDialog').close()}catch(err){$('status').textContent='บันทึกไม่สำเร็จ: '+err.message}};
$('downloadQr').onclick=()=>{let canvas=$('qr').querySelector('canvas');if(!canvas){alert('กรุณาเผยแพร่เว็บและตั้งค่า URL ก่อน');return}let out=document.createElement('canvas');out.width=800;out.height=800;let ctx=out.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,800,800);ctx.imageSmoothingEnabled=false;ctx.drawImage(canvas,0,0,800,800);ctx.imageSmoothingEnabled=true;ctx.fillStyle='#fff';ctx.fillRect(324,324,152,152);ctx.drawImage($('brandLogo'),330,330,140,140);let a=document.createElement('a');a.download='ZAAP-QR.png';a.href=out.toDataURL('image/png');a.click()};
render();if(firebaseConfig.apiKey&&firebaseConfig.projectId&&ADMIN_UIDS.length===2){try{let appM=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js');let authM=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');let storeM=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js');let app=appM.initializeApp(firebaseConfig);auth=authM.getAuth(app);await authM.signOut(auth);await authM.setPersistence(auth,authM.inMemoryPersistence);db=storeM.getFirestore(app);docRef=storeM.doc(db,'sites','zaap');storeM.onSnapshot(docRef,snap=>{if(snap.exists()){let saved=snap.data();data={...defaults,...saved};if(saved.channelSeedVersion!==CHANNEL_SEED_VERSION){data.links=[...(Array.isArray(saved.links)?saved.links:[])];for(const added of defaults.links.slice(-2)){if(!data.links.some(x=>safeUrl(x.url)===safeUrl(added.url)))data.links.push(structuredClone(added))}}render();if(currentUser&&ADMIN_UIDS.includes(currentUser.uid))editRender()}},err=>console.warn('โหลดข้อมูลไม่ได้',err));authM.onAuthStateChanged(auth,user=>{currentUser=user;if(user&&!ADMIN_UIDS.includes(user.uid)){authM.signOut(auth);$('status').textContent='บัญชีนี้ไม่มีสิทธิ์แก้ไข'}updateAdmin()})}catch(err){console.warn('Firebase initialization failed',err)}}
</script></body></html>
