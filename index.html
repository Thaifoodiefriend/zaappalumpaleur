function renderQR(){let target=safeUrl(data.siteUrl)||(/https?:/.test(location.protocol)?location.href.split('#')[0].split('?')[0]:null);$('qr').replaceChildren();if(!target){$('qr').textContent='เผยแพร่เว็บหรือใส่ URL เพื่อสร้าง QR';$('qrHint').textContent='QR พร้อมใช้งานเมื่อมี URL ของเว็บ';return}if(typeof QRCode==='undefined'){$('qr').textContent='กำลังโหลด QR…';setTimeout(renderQR,1000);return}new QRCode($('qr'),{text:target,width:220,height:220,colorDark:'#0E0E0E',colorLight:'#FFFFFF',correctLevel:QRCode.CorrectLevel.H});let mark=document.createElement('img');mark.className='qr-logo';mark.src=qrLogo;mark.alt='ZAAP';$('qr').append(mark);$('qrHint').textContent='สแกนเพื่อเปิด '+target}

function channelLogo(item){
 if(typeof item.image==='string'&&/^data:image\/(?:png|jpeg|webp);base64,/i.test(item.image))return item.image;
 let platform=platformOf(item);if(!platform)return null;
 let colors={facebook:'#1877F2',shopee:'#EE4D2D',lazada:'#201169',tiktok:'#0E0E0E',website:'#006149'};
 let svg=platformSvg[platform].replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ');
 svg=svg.replace('>', '><rect width="24" height="24" rx="4" fill="'+colors[platform]+'"/>');
 return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function loadQrImage(src){return new Promise((resolve,reject)=>{let img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(Error('อ่านโลโก้ไม่สำเร็จ'));img.src=src})}
async function createChannelQr(item,withLogo){
 let url=safeUrl(item.url);if(!url)throw Error('กรอก URL ที่ถูกต้องเพื่อสร้าง QR');
 if(typeof QRCode==='undefined')throw Error('QR ยังโหลดไม่เสร็จ กรุณาลองอีกครั้ง');
 let holder=document.createElement('div');new QRCode(holder,{text:url,width:600,height:600,colorDark:'#0E0E0E',colorLight:'#FFFFFF',correctLevel:QRCode.CorrectLevel.H});
 let raw=holder.querySelector('canvas');if(!raw)throw Error('สร้าง QR ไม่สำเร็จ');
 let out=document.createElement('canvas');out.width=720;out.height=720;let ctx=out.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,720,720);ctx.imageSmoothingEnabled=false;ctx.drawImage(raw,60,60,600,600);
 let src=withLogo?channelLogo(item):null;
 if(src){let img=await loadQrImage(src);ctx.fillStyle='#fff';ctx.fillRect(288,288,144,144);ctx.imageSmoothingEnabled=true;let scale=Math.min(120/img.width,120/img.height);let w=img.width*scale,h=img.height*scale;ctx.drawImage(img,(720-w)/2,(720-h)/2,w,h)}
 return out;
}
function addChannelQrEditor(box){
 let panel=document.createElement('div');panel.className='channel-qr';let controls=document.createElement('div');controls.className='channel-qr-controls';let label=document.createElement('label');let toggle=document.createElement('input');toggle.type='checkbox';toggle.checked=true;label.append(toggle,document.createTextNode('ใส่โลโก้ช่องทางใน QR'));let generate=document.createElement('button');generate.type='button';generate.textContent='สร้าง / อัปเดต QR';let download=document.createElement('button');download.type='button';download.textContent='ดาวน์โหลด QR ช่องทาง';download.disabled=true;let message=document.createElement('div');message.className='channel-qr-message';message.textContent='QR นี้เปิดช่องทางโดยตรง เลือกมีโลโก้หรือไม่มีโลโก้ได้';let preview=document.createElement('div');let currentCanvas=null,request=0;
 function readItem(){return {...Object.fromEntries([...box.querySelectorAll('input[data-key]')].map(x=>[x.dataset.key,x.value.trim()])),image:box.imageData||''}}
 function invalidate(){request++;currentCanvas=null;preview.replaceChildren();download.disabled=true;message.textContent='กดสร้าง / อัปเดต QR เพื่อใช้ข้อมูลล่าสุด'}
 async function update(){let id=++request;download.disabled=true;message.textContent='กำลังสร้าง QR…';try{let item=readItem();let canvas=await createChannelQr(item,toggle.checked);if(id!==request)return;currentCanvas=canvas;preview.replaceChildren(canvas);download.disabled=false;message.textContent=toggle.checked&&!channelLogo(item)?'ช่องทางนี้ยังไม่มีโลโก้ กรุณาเลือกรูปโลโก้ หรือใช้ QR แบบไม่มีโลโก้': 'QR สำหรับ '+(item.name||'ช่องทาง')+' — '+(toggle.checked?'มีโลโก้':'ไม่มีโลโก้')}catch(err){if(id!==request)return;currentCanvas=null;preview.replaceChildren();message.textContent=err.message}}
 generate.onclick=update;toggle.onchange=update;box.addEventListener('input',event=>{if(event.target.matches('input[data-key]'))invalidate()});box.addEventListener('channel-image-change',invalidate);
 download.onclick=()=>{if(!currentCanvas)return;let a=document.createElement('a');let name=(readItem().name||'channel').replace(/[\\/:*?"<>|]/g,'-');a.download=name+'-QR'+(toggle.checked?'-logo':'')+'.png';a.href=currentCanvas.toDataURL('image/png');a.click()};controls.append(label,generate,download);panel.append(controls,preview,message);box.append(panel);
}

function editRender(){$('editIntro').value=data.intro||'';$('siteUrl').value=data.siteUrl||'';$('accent').value=data.accent||defaults.accent;$('editLinks').replaceChildren();for(const item of data.links||[])addEditorRow(item)}
function refreshOrder(){[...$('editLinks').children].forEach((row,index)=>{row.querySelector('.order-position').textContent='ลำดับที่ '+(index+1);let buttons=row.querySelectorAll('.order-row button');buttons[0].disabled=index===0;buttons[1].disabled=index===$('editLinks').children.length-1})}
function addEditorRow(item={name:'',url:'',label:'',icon:'↗'}){let box=document.createElement('div');box.className='admin-item';for(const [key,hint] of [['name','ชื่อช่องทาง'],['url','https://...'],['label','คำอธิบาย'],['icon','ไอคอน 1–2 ตัว']]){let input=document.createElement('input');input.placeholder=hint;input.dataset.key=key;input.value=item[key]||'';box.append(input)}let order=document.createElement('div');order.className='order-row';let position=document.createElement('strong');position.className='order-position';let up=document.createElement('button');up.type='button';up.textContent='↑ เลื่อนขึ้น';up.onclick=()=>{let previous=box.previousElementSibling;if(previous){previous.before(box);refreshOrder()}};let down=document.createElement('button');down.type='button';down.textContent='↓ เลื่อนลง';down.onclick=()=>{let next=box.nextElementSibling;if(next){next.after(box);refreshOrder()}};order.append(position,up,down);box.prepend(order);let del=document.createElement('button');del.type='button';del.textContent='ลบ';del.onclick=()=>{box.remove();refreshOrder()};box.append(del);
box.imageData=item.image||'';let uploader=document.createElement('div');uploader.className='upload-row';let preview=document.createElement('img');preview.className='image-preview';preview.alt='ตัวอย่างรูปช่องทาง';let label=document.createElement('label');label.className='upload-label';label.textContent='เลือกรูปโลโก้';let file=document.createElement('input');file.type='file';file.accept='image/png,image/jpeg,image/webp';file.className='visually-hidden';label.append(file);let clear=document.createElement('button');clear.type='button';clear.textContent='เอารูปออก';clear.onclick=()=>{box.imageData='';file.value='';updatePreview()};function updatePreview(){box.dispatchEvent(new Event('channel-image-change'));preview.classList.toggle('hidden',!box.imageData);clear.classList.toggle('hidden',!box.imageData);if(box.imageData)preview.src=box.imageData;else preview.removeAttribute('src')}
file.onchange=async()=>{let chosen=file.files?.[0];if(!chosen)return;if(!['image/png','image/jpeg','image/webp'].includes(chosen.type)||chosen.size>10*1024*1024){$('status').textContent='กรุณาเลือกรูป PNG, JPG หรือ WebP ขนาดไม่เกิน 10 MB';file.value='';return}try{let bitmap=await createImageBitmap(chosen);let canvas=document.createElement('canvas');canvas.width=128;canvas.height=128;let ctx=canvas.getContext('2d');ctx.clearRect(0,0,128,128);let ratio=Math.min(128/bitmap.width,128/bitmap.height);let w=bitmap.width*ratio,h=bitmap.height*ratio;ctx.drawImage(bitmap,(128-w)/2,(128-h)/2,w,h);bitmap.close();let encoded=canvas.toDataURL('image/webp',.82);if(encoded.length>100000)throw Error('รูปที่ย่อแล้วยังใหญ่เกินไป');box.imageData=encoded;updatePreview();$('status').textContent='เลือกรูปแล้ว กดบันทึกเพื่อเผยแพร่'}catch(err){$('status').textContent='อ่านรูปไม่สำเร็จ กรุณาลองรูปอื่น'}file.value=''};
uploader.append(preview,label,clear);box.append(uploader);updatePreview();addChannelQrEditor(box);$('editLinks').append(box);refreshOrder()}
$('adminBtn').onclick=()=>{$('adminDialog').showModal();updateAdmin()};$('closeDialog').onclick=()=>$('adminDialog').close();$('adminDialog').onclick=e=>{if(e.target===$('adminDialog'))$('adminDialog').close()};$('adminDialog').addEventListener('close',async()=>{if(auth&&currentUser){let m=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');await m.signOut(auth)}$('password').value='';$('status').textContent=''});$('addLink').onclick=()=>addEditorRow();$('resetColor').onclick=()=>$('accent').value=defaults.accent;
function updateAdmin(){let yes=!!currentUser&&ADMIN_UIDS.includes(currentUser.uid);$('loginArea').classList.toggle('hidden',yes);$('editorArea').classList.toggle('hidden',!yes);$('modalTitle').textContent=yes?'จัดการหน้า ZAAP':'เข้าสู่ระบบผู้ดูแล';if(yes)editRender()}
$('loginForm').onsubmit=async e=>{e.preventDefault();if(!auth){$('status').textContent='กรุณาตั้งค่า Firebase ก่อน';return}try{let account=ADMINS[$('username').value.trim().toLowerCase()];if(!account?.email){$('status').textContent='ไม่พบชื่อผู้ใช้หรือยังไม่ได้ตั้งค่าบัญชี';return}let m=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');await m.signInWithEmailAndPassword(auth,account.email,$('password').value);$('status').textContent='เข้าสู่ระบบแล้ว'}catch(err){$('status').textContent=['auth/invalid-credential','auth/wrong-password','auth/user-not-found'].includes(err.code)?'อีเมลหรือรหัสผ่านไม่ตรงกับบัญชี Firebase กรุณาตรวจรหัสผ่านที่บันทึกไว้ในเบราว์เซอร์ และลองกรอกใหม่':'เข้าสู่ระบบไม่สำเร็จ: '+err.message}};
$('logout').onclick=async()=>{if(auth){let m=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');await m.signOut(auth)}$('status').textContent='ออกจากระบบแล้ว'};
$('save').onclick=async()=>{if(!currentUser||!ADMIN_UIDS.includes(currentUser.uid)||!db||!docRef)return;let rows=[...$('editLinks').children].map(row=>Object.fromEntries([...row.querySelectorAll('input[data-key]')].map(x=>[x.dataset.key,x.value.trim()]).concat([['image',row.imageData||'']]))).filter(x=>x.name||x.url);if(rows.some(x=>!x.name||!safeUrl(x.url))){$('status').textContent='กรุณากรอกชื่อและ URL ที่ขึ้นต้นด้วย https:// ให้ครบ';return}let raw=$('siteUrl').value.trim();if(raw&&!safeUrl(raw)){$('status').textContent='URL ของ QR ไม่ถูกต้อง';return}let next={intro:$('editIntro').value.trim(),siteUrl:raw,accent:$('accent').value,links:rows,channelSeedVersion:CHANNEL_SEED_VERSION};try{let m=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js');await m.setDoc(docRef,next);$('status').textContent='บันทึกสำเร็จ';$('adminDialog').close()}catch(err){$('status').textContent='บันทึกไม่สำเร็จ: '+err.message}};
$('downloadQr').onclick=()=>{let canvas=$('qr').querySelector('canvas');if(!canvas){alert('กรุณาเผยแพร่เว็บและตั้งค่า URL ก่อน');return}let out=document.createElement('canvas');out.width=900;out.height=900;let ctx=out.getContext('2d');ctx.fillStyle='#281d19';ctx.fillRect(0,0,900,900);ctx.fillStyle='#fff';ctx.fillRect(30,30,840,840);ctx.imageSmoothingEnabled=false;ctx.drawImage(canvas,85,85,730,730);ctx.imageSmoothingEnabled=true;ctx.fillStyle='#fff';ctx.fillRect(278,375,344,150);let mark=new Image();mark.onload=()=>{ctx.drawImage(mark,295,398,310,83);let a=document.createElement('a');a.download='ZAAP-QR.png';a.href=out.toDataURL('image/png');a.click()};mark.src=qrLogo;};
render();if(firebaseConfig.apiKey&&firebaseConfig.projectId&&ADMIN_UIDS.length===2){try{let appM=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js');let authM=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');let storeM=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js');let app=appM.initializeApp(firebaseConfig);auth=authM.getAuth(app);await authM.signOut(auth);await authM.setPersistence(auth,authM.inMemoryPersistence);db=storeM.getFirestore(app);docRef=storeM.doc(db,'sites','zaap');storeM.onSnapshot(docRef,snap=>{if(snap.exists()){let saved=snap.data();data={...defaults,...saved};if(saved.channelSeedVersion!==CHANNEL_SEED_VERSION){data.links=[...(Array.isArray(saved.links)?saved.links:[])];let pending=(Number(saved.channelSeedVersion)||0)<1?defaults.links.slice(5):defaults.links.slice(7);for(const added of pending){if(!data.links.some(x=>safeUrl(x.url)===safeUrl(added.url)))data.links.push(structuredClone(added))}}render();if(currentUser&&ADMIN_UIDS.includes(currentUser.uid))editRender()}},err=>console.warn('โหลดข้อมูลไม่ได้',err));authM.onAuthStateChanged(auth,user=>{currentUser=user;if(user&&!ADMIN_UIDS.includes(user.uid)){authM.signOut(auth);$('status').textContent='บัญชีนี้ไม่มีสิทธิ์แก้ไข'}updateAdmin()})}catch(err){console.warn('Firebase initialization failed',err)}}
</script></body></html>
